name: Build C++ Plugin (Linux & Windows)

on:
  push:
    branches:
      - '6.0'
      - 'master'
    paths:
      - 'cppPart/**'
      - '.github/workflows/build-cpp-plugins.yml'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      krita_branch:
        description: 'Krita branch or tag to build against (e.g. krita/6.0, master, release/6.0.3)'
        required: true
        default: 'krita/6.0'
        type: string

jobs:
  build-linux:
    name: Build Linux .so
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo sed -Ei 's/^# deb-src /deb-src /' /etc/apt/sources.list /etc/apt/sources.list.d/*.sources || true
          sudo sed -Ei 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/*.sources || true
          sudo apt-get update
          sudo apt-get build-dep -y krita || true
          sudo apt-get install -y \
            build-essential cmake ninja-build patchelf zip extra-cmake-modules \
            qtbase5-dev libqt5svg5-dev libqt5x11extras5-dev qtdeclarative5-dev qtmultimedia5-dev \
            libkf5config-dev libkf5widgetsaddons-dev libkf5completion-dev \
            libkf5coreaddons-dev libkf5guiaddons-dev libkf5i18n-dev \
            libkf5itemviews-dev libkf5kio-dev libkf5windowsystem-dev libkf5crash-dev libboost-dev

      - name: Shallow clone Krita source tree (${{ github.event.inputs.krita_branch || 'krita/6.0' }})
        run: |
          BRANCH="${{ github.event.inputs.krita_branch || 'krita/6.0' }}"
          echo "Cloning branch: $BRANCH"
          git clone --depth 1 --branch "$BRANCH" https://invent.kde.org/graphics/krita.git ~/krita-src

      - name: Inject uv-select into Krita build tree
        run: |
          cp -r cppPart/uv-select ~/krita-src/plugins/uv-select
          echo "add_subdirectory(uv-select)" >> ~/krita-src/plugins/CMakeLists.txt

      - name: Configure CMake
        run: |
          cmake -B ~/krita-build -S ~/krita-src -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DKRITA_ENABLE_PYTHON_2=OFF

      - name: Build kritashapesselection target
        run: |
          ninja -C ~/krita-build kritashapesselection

      - name: Package and sanitize Linux .so
        run: |
          mkdir -p dist/lib/kritaplugins dist/share/krita/actions
          
          # Find and copy the compiled .so
          SO_PATH=$(find ~/krita-build -name "kritashapesselection.so" | head -n 1)
          cp "$SO_PATH" dist/lib/kritaplugins/
          cp cppPart/uv-select/kritashapesselection.action dist/share/krita/actions/
          
          # Strip hardcoded runner paths and set relative origin RPATH
          patchelf --set-rpath '$ORIGIN/..:$ORIGIN' dist/lib/kritaplugins/kritashapesselection.so
          
          # Create zip package
          cd dist && zip -r ../uv-select-linux.zip lib/ share/ && cd ..

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: uv-select-linux
          path: uv-select-linux.zip

  build-windows:
    name: Build Windows .dll
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2 with KDE Frameworks & Qt
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            git
            zip
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-extra-cmake-modules
            mingw-w64-x86_64-qt5-base
            mingw-w64-x86_64-qt5-svg
            mingw-w64-x86_64-kf5-kconfig
            mingw-w64-x86_64-kf5-kwidgetsaddons
            mingw-w64-x86_64-kf5-kcompletion
            mingw-w64-x86_64-kf5-kcoreaddons
            mingw-w64-x86_64-kf5-kguiaddons
            mingw-w64-x86_64-kf5-ki18n
            mingw-w64-x86_64-kf5-kitemviews
            mingw-w64-x86_64-boost

      - name: Shallow clone Krita source tree (${{ github.event.inputs.krita_branch || 'krita/6.0' }})
        shell: msys2 {0}
        run: |
          BRANCH="${{ github.event.inputs.krita_branch || 'krita/6.0' }}"
          echo "Cloning branch: $BRANCH"
          git clone --depth 1 --branch "$BRANCH" https://invent.kde.org/graphics/krita.git ~/krita-src

      - name: Inject uv-select into Krita build tree
        shell: msys2 {0}
        run: |
          cp -r cppPart/uv-select ~/krita-src/plugins/uv-select
          echo "add_subdirectory(uv-select)" >> ~/krita-src/plugins/CMakeLists.txt

      - name: Configure CMake
        shell: msys2 {0}
        run: |
          cmake -B ~/krita-build -S ~/krita-src -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DKRITA_ENABLE_PYTHON_2=OFF

      - name: Build kritashapesselection target
        shell: msys2 {0}
        run: |
          ninja -C ~/krita-build kritashapesselection

      - name: Package Windows .dll
        shell: msys2 {0}
        run: |
          mkdir -p dist/bin dist/share/krita/actions
          DLL_PATH=$(find ~/krita-build -name "kritashapesselection.dll" | head -n 1)
          cp "$DLL_PATH" dist/bin/
          cp cppPart/uv-select/kritashapesselection.action dist/share/krita/actions/
          cd dist && zip -r ../uv-select-windows.zip * && cd ..

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: uv-select-windows
          path: uv-select-windows.zip

  release:
    name: Publish Release Packages
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: uv-select-linux

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: uv-select-windows

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            uv-select-linux.zip
            uv-select-windows.zip
