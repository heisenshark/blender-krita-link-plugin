name: Build C++ Plugin (Linux & Windows)

on:
  push:
    branches:
      - '6.0'
      - 'master'
    paths:
      - 'cppPart/**'
      - 'flake.nix'
      - '.github/workflows/build-cpp-plugins.yml'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      krita_branch:
        description: 'Krita branch or tag to build against (e.g. krita/6.0, master, release/6.0.3)'
        required: true
        default: 'krita/6.0'
        type: string

jobs:
  build-linux:
    name: Build Linux .so via Nix
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
            substituters = https://cache.nixos.org/

      - name: Build portable Linux plugin via Nix Flake
        run: |
          nix build .#portable-plugin --out-link result-plugin
          cp result-plugin/dist/uv-select-linux.zip ./uv-select-linux.zip

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: uv-select-linux
          path: uv-select-linux.zip

  build-windows:
    name: Build Windows .dll via MSYS2 UCRT64
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            git
            zip
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-extra-cmake-modules
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-svg
            mingw-w64-ucrt-x86_64-kconfig
            mingw-w64-ucrt-x86_64-kwidgetsaddons
            mingw-w64-ucrt-x86_64-kcompletion
            mingw-w64-ucrt-x86_64-kcoreaddons
            mingw-w64-ucrt-x86_64-kguiaddons
            mingw-w64-ucrt-x86_64-ki18n
            mingw-w64-ucrt-x86_64-kitemviews
            mingw-w64-ucrt-x86_64-immer
            mingw-w64-ucrt-x86_64-lager
            mingw-w64-ucrt-x86_64-zug
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-eigen3
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-libpng

      - name: Shallow clone Krita source tree
        shell: msys2 {0}
        run: |
          BRANCH="${{ github.event.inputs.krita_branch || 'krita/6.0' }}"
          echo "Cloning branch: $BRANCH"
          git clone --depth 1 --branch "$BRANCH" https://invent.kde.org/graphics/krita.git ~/krita-src

      - name: Inject uv-select into Krita build tree
        shell: msys2 {0}
        run: |
          cp -r cppPart/uv-select ~/krita-src/plugins/uv-select
          echo "add_subdirectory(uv-select)" >> ~/krita-src/plugins/CMakeLists.txt

      - name: Configure CMake
        shell: msys2 {0}
        run: |
          cmake -B ~/krita-build -S ~/krita-src -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_WITH_QT6=ON \
            -DBUILD_TESTING=OFF \
            -DKRITA_ENABLE_PYTHON_2=OFF

      - name: Build kritashapesselection target
        shell: msys2 {0}
        run: |
          ninja -C ~/krita-build kritashapesselection

      - name: Package Windows .dll
        shell: msys2 {0}
        run: |
          mkdir -p dist/bin dist/share/krita/actions
          DLL_PATH=$(find ~/krita-build -name "kritashapesselection.dll" | head -n 1)
          if [ -z "$DLL_PATH" ]; then
            echo "Error: kritashapesselection.dll not found in build dir!"
            find ~/krita-build -name "*.dll"
            exit 1
          fi
          echo "Found DLL at: $DLL_PATH"
          cp "$DLL_PATH" dist/bin/
          cp cppPart/uv-select/kritashapesselection.action dist/share/krita/actions/
          cd dist && zip -r ../uv-select-windows.zip * && cd ..

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: uv-select-windows
          path: uv-select-windows.zip

  release:
    name: Publish Release Packages
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: uv-select-linux

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: uv-select-windows

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            uv-select-linux.zip
            uv-select-windows.zip
